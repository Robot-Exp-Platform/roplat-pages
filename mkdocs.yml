site_name: roplat
site_description: 用 Rust 的 Node、Rhythm 与 System 组织机器人程序。
site_url: https://robot-exp-platform.github.io/roplat-pages/
repo_name: roplat-pages
repo_url: https://github.com/Robot-Exp-Platform/roplat-pages
edit_uri: ''
strict: true

nav:
  - 首页: index.md
  - 开始:
      - 安装与第一个程序: start/first-system.md
      - 学习路线: start/roadmap.md
  - 教程:
      - 节律的四个边界: tutorial/rhythm-boundaries.md
      - 借用设备: tutorial/resources.md
      - 分支、条件与重试: tutorial/branches.md
      - 多层节律: tutorial/layers.md
      - 失败、停止与收尾: tutorial/stop-and-failure.md
      - 多设备与旁路: tutorial/sideband.md
      - 事件与信号: tutorial/events.md
      - hard 节律: tutorial/hard.md
  - 概念:
      - Node: concepts/node.md
      - Rhythm: concepts/rhythm.md
      - System 与图: concepts/system.md
      - 资源借用: concepts/resources.md
      - 生命周期与执行结果: concepts/lifecycle.md
      - 并发与放置: concepts/placement.md
      - 通信: concepts/communication.md
      - 录制与回放: concepts/replay.md
  - 连接工程:
      - C++ 与 Python 节点: integrate/languages.md
      - YAML 文件入口: integrate/yaml.md
      - 查看静态图: integrate/graph.md
  - 参考:
      - 语法速查: reference/syntax.md
      - 内置节点与节律: reference/builtins.md
      - 常见编译诊断: reference/diagnostics.md
      - 从 0.4 迁移: reference/migration.md
      - 支持范围与已知问题: reference/scope.md
      - 与 AI 协作: reference/ai.md
  - English: en/index.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

theme:
  name: material
  language: zh
  font: false
  logo: assets/icon.png
  favicon: assets/icon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: 切换到深色模式
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: 切换到浅色模式

plugins:
  - search:
      lang: [zh, en]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/site.css

copyright: roplat 仍在快速迭代，API 不稳定 · 文档对应 roplat 0.5.0
